name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Load upload key (if configured)
        env:
          KEY_B64: ${{ secrets.TH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "TH_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release will be signed with the upload key"
          else
            echo "::warning::No upload key secret; release bundle is debug-signed and NOT valid for Play"
          fi
      - name: Build APK and Play bundle
        env:
          TH_STORE_PASS: ${{ secrets.TH_STORE_PASS }}
          TH_KEY_ALIAS: ${{ secrets.TH_KEY_ALIAS }}
          TH_KEY_PASS: ${{ secrets.TH_KEY_PASS }}
        run: |
          set -o pipefail
          gradle assembleDebug bundleRelease --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Unresolved" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalHour-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalHour-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
