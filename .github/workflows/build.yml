name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Unresolved" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalHour-debug
          path: app/build/outputs/apk/debug/app-debug.apk
